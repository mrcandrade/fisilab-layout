# .deb and .rpm packages (nfpm: https://nfpm.goreleaser.com). Run by package.sh, which stages
# the file tree, substitutes its path for ${STAGE} (nfpm doesn't expand env vars in `src`) and
# exports VERSION and NFPM_ARCH.
#
#   nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/release/
name: fisilab-layout
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
# semver: 0.2.0-rc.1 becomes 0.2.0~rc.1 in deb/rpm, so pre-releases sort before the release.
version_schema: semver
release: 1
section: graphics
priority: optional
maintainer: "FisiLab - LARFIC/UFRGS <mrcandrade@users.noreply.github.com>"
vendor: FisiLab - LARFIC/UFRGS
homepage: https://github.com/mrcandrade/larfic
license: MIT OR Apache-2.0
description: |-
  Layout, da Suíte FisiLab: diagramação e editoração (alternativa livre ao Adobe InDesign).
  Páginas mestras, quadros de texto encadeados, estilos de parágrafo e de caractere, amostras
  de cor, contorno de texto e importação/exportação de IDML.
  Inclui o fisilab-layout-cli, um renderizador e executor de comandos sem interface.
  Baseado no DesignCraft, do ArtCraft Team e contribuidores (MIT ou Apache 2.0).

# The binaries link only glibc and libgcc_s directly. Windowing (X11/Wayland, xkbcommon) and the
# GPU (Vulkan, EGL/GL) are loaded at runtime, so they are dependencies/recommendations here
# rather than ELF NEEDED entries.
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libgcc-s1
      - libxkbcommon0
      - libvulkan1 | libegl1
    recommends:
      - libwayland-client0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxi6
      - libxrandr2
      - mesa-vulkan-drivers
      - xdg-desktop-portal
  rpm:
    depends:
      - libxkbcommon
      - (vulkan-loader or libglvnd-egl)
    recommends:
      - libwayland-client
      - libX11
      - libXcursor
      - libXi
      - libXrandr
      - mesa-vulkan-drivers
      - xdg-desktop-portal

contents:
  - src: ${STAGE}/usr/bin/fisilab-layout
    dst: /usr/bin/fisilab-layout
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/bin/fisilab-layout-cli
    dst: /usr/bin/fisilab-layout-cli
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/
    dst: /usr/share/
    type: tree

scripts:
  postinstall: packaging/linux/postinst.sh
  postremove: packaging/linux/postinst.sh
